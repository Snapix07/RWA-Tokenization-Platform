specVersion: 0.0.5
description: RWA Tokenization Platform — indexes asset onboarding, vault positions, AMM
  swaps, and DAO governance.
repository: https://github.com/Snapix07/RWA-Tokenization-Platform
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: AssetFactory
    network: arbitrum-sepolia
    source:
      address: "0xfC83C440Bd3Cd8b6FC5ABB5f1E7a67f38F3A0f7d"
      abi: AssetFactory
      startBlock: 269083041
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - AssetToken
      abis:
        - name: AssetFactory
          file: AssetFactory\AssetFactory.json
      eventHandlers:
        - event: TokenDeployed(indexed bytes32,indexed address,bool)
          handler: handleTokenDeployed
      file: AssetFactory\AssetFactory.wasm
  - kind: ethereum
    name: RWAVault
    network: arbitrum-sepolia
    source:
      address: "0x7d71cAa220df8aFe473393Ab646e0fF11ce3cB82"
      abi: RWAVault
      startBlock: 269083071
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - VaultPosition
      abis:
        - name: RWAVault
          file: RWAVault\RWAVault.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
      file: AssetFactory\AssetFactory.wasm
  - kind: ethereum
    name: RWAAMM
    network: arbitrum-sepolia
    source:
      address: "0xd56101f885ADe6B501C47DA940d8EFC972666554"
      abi: RWAAMM
      startBlock: 269083084
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - AmmSwap
      abis:
        - name: RWAAMM
          file: RWAAMM\RWAAMM.json
      eventHandlers:
        - event: Swap(indexed address,indexed address,uint256,uint256)
          handler: handleSwap
        - event: Sync(uint112,uint112)
          handler: handleSync
      file: AssetFactory\AssetFactory.wasm
  - kind: ethereum
    name: RWAGovernor
    network: arbitrum-sepolia
    source:
      address: "0x4DAc8bc9d16665D4AED79bfc62c22dD7CA4Fa072"
      abi: RWAGovernor
      startBlock: 269083110
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - GovernanceProposal
        - ProposalVote
      abis:
        - name: RWAGovernor
          file: RWAGovernor\RWAGovernor.json
      eventHandlers:
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
        - event: ProposalQueued(uint256,uint256)
          handler: handleProposalQueued
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
        - event: ProposalCanceled(uint256)
          handler: handleProposalCanceled
      file: AssetFactory\AssetFactory.wasm
