name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: slither
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: npm ci

      - name: Prettier — frontend
        run: npx prettier --check 'packages/frontend/src/**/*.{js,ts,jsx,tsx}'

      - name: forge fmt --check
        working-directory: packages/contracts
        run: forge fmt --check

      - name: solhint
        working-directory: packages/contracts
        run: npx solhint 'src/**/*.sol'

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        working-directory: packages/contracts
        run: forge build

      - name: Run tests
        working-directory: packages/contracts
        run: forge test -vvv

      - name: Coverage
        working-directory: packages/contracts
        run: forge coverage

  slither:
    name: Slither
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run Slither
        uses: crytic/slither-action@v0.4.1
        with:
          target: packages/contracts
          fail-on: high

  # Umbrella job — satisfies the "validate" required status check on protected branches
  validate:
    name: validate
    runs-on: ubuntu-latest
    needs: [lint, build-and-test, slither]
    steps:
      - run: echo "All checks passed"
